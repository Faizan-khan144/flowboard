services:
  - type: web
    name: flowboard-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_URL
        value: file:/var/data/flowboard.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
    disk:
      name: flowboard-data
      mountPath: /var/data
      sizeGB: 1
